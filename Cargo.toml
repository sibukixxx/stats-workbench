[workspace]
members = [
    "crates/stats-workbench",
    "crates/sf-core",
    "crates/sf-data",
    "crates/sf-stats",
    "crates/sf-engine",
    "crates/sf-report",
    "crates/sf-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.89"
repository = "https://github.com/sibukixxx/stats-workbench"
homepage = "https://github.com/sibukixxx/stats-workbench"

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Data
polars = { version = "0.46", features = ["lazy", "parquet", "dtype-struct", "round_series"] }

# Database
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "sqlite", "postgres"] }
tokio = { version = "1", features = ["full"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Statistics
statrs = "0.18"

# Testing
assert_cmd = "2"
predicates = "3"
