# 例2: 相関分析
#
# 複数の数値列の相関を確認して、変数間の関係性を把握する。
# pearson (線形相関) と spearman (順位相関) の2つを比較。
#
# 準備:
#   cargo run -p statforge --example generate_sample_data
#
# 実行:
#   sf run --recipe examples/02_correlation.toml
#
# CLI で直接実行する場合:
#   sf eda corr --source examples/data/employees.parquet \
#     --cols years_exp,salary,performance_score,projects_completed \
#     --method pearson

[source]
type = "parquet"
path = "examples/data/employees.parquet"

[[steps]]
id = "pearson_corr"
type = "eda.correlation"
cols = ["years_exp", "salary", "performance_score", "projects_completed"]
method = "pearson"

[[steps]]
id = "spearman_corr"
type = "eda.correlation"
cols = ["years_exp", "salary", "performance_score", "projects_completed"]
method = "spearman"

[output]
terminal = true
