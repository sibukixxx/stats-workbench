# 例1: 基本の要約統計
#
# 最もシンプルな使い方。売上データの基本統計量を確認する。
#
# 準備:
#   cargo run -p statforge --example generate_sample_data
#
# 実行:
#   sf run --recipe examples/01_basic_summary.toml
#
# CLI で直接実行する場合:
#   sf eda summary --source examples/data/sales.parquet --cols price,quantity,revenue

[source]
type = "parquet"
path = "examples/data/sales.parquet"

[[steps]]
id = "sales_summary"
type = "eda.summary"
cols = ["price", "quantity", "revenue"]

[output]
terminal = true
