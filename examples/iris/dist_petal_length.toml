# Iris: 花弁長の分布分析
#
# What: petal_length のヒストグラム（20ビン）
# Why:  二峰性分布の検出 — 種の分離がデータから見える

[source]
type = "parquet"
path = "examples/iris/data/iris.parquet"

[[steps]]
id = "petal_dist"
type = "eda.dist"
col = "petal_length"
bins = 20

[[steps]]
id = "sepal_outliers"
type = "stats.outlier_detect"
cols = ["sepal_width", "petal_length", "petal_width"]
method = "iqr"
action = "flag"

[output]
terminal = true
format = "json"
path = "output/iris_dist.json"
artifacts = ["petal_dist", "sepal_outliers"]
